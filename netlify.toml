[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/get-data"
  status = 200

[[redirects]]
  from = "/api/trigger"
  to = "/.netlify/functions/trigger-crawler"
  status = 200

[[redirects]]
  from = "/api/weights"
  to = "/.netlify/functions/save-weights"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
